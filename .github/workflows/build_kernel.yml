name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev clang lld device-tree-compiler libelf-dev \
            zlib1g-dev wget tar gcc-aarch64-linux-gnu

      # No download needed — gcc-aarch64-linux-gnu is now installed via apt above.
      # We just set CROSS_COMPILE in GITHUB_ENV so it persists across all steps.
      - name: Set cross-compile env
        run: |
          echo "CROSS_COMPILE=aarch64-linux-gnu-" >> $GITHUB_ENV

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git KernelSU

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Build kernel
        run: make -C . O=out -j$(nproc) CROSS_COMPILE=${{ env.CROSS_COMPILE }}

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz
