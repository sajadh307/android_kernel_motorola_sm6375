name: Build KernelSU Kernel for Moto G45 (fogos) - GCC

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev lld device-tree-compiler libelf-dev \
            zlib1g-dev wget tar

      - name: Download stable Linaro GCC
        run: |
          wget https://github.com/<your-repo>/releases/download/<tag>/gcc-linaro-12.2.1-2023.04-x86_64_aarch64-linux-gnu.tar.xz
          tar -xf gcc-linaro-12.2.1-2023.04-x86_64_aarch64-linux-gnu.tar.xz
          export PATH=$PWD/gcc-linaro-12.2.1-2023.04-x86_64_aarch64-linux-gnu/bin:$PATH
          export CROSS_COMPILE=aarch64-linux-gnu-

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git KernelSU

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: make -C . O=out -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz
