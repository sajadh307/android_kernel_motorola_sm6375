name: Build KernelSU Kernel for Moto G45 (fogos)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies + ARM64 compiler
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev libncurses5-dev clang lld gcc-aarch64-linux-gnu g++-aarch64-linux-gnu wget tar

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git KernelSU

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          make O=out defconfig CROSS_COMPILE=aarch64-linux-gnu-

      - name: Build kernel
        run: make -C . O=out -j$(nproc) CROSS_COMPILE=aarch64-linux-gnu-

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz
