name: Build KernelSU Kernel for Moto G45 (fogos) - GCC + Clang

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        COMPILER: [gcc, clang]  # Build with both GCC and Clang

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git bc bison flex libssl-dev make libc6-dev \
            libncurses5-dev clang lld llvm device-tree-compiler libelf-dev zlib1g-dev \
            llvm-ar llvm-nm llvm-objcopy llvm-objdump llvm-strip wget tar

      - name: Download prebuilt Linaro GCC (for GCC build)
        if: matrix.COMPILER == 'gcc'
        run: |
          wget https://github.com/<your-username>/toolchains/releases/download/v1/gcc-linaro.tar.xz
          tar -xf gcc-linaro.tar.xz
          echo "$PWD/gcc-linaro/bin" >> $GITHUB_PATH

      - name: Clone KernelSU
        run: git clone https://github.com/tiann/KernelSU.git KernelSU

      - name: Fix trampoline.c missing include
        run: |
          sed -i '/#include <linux\/filter.h>/a #include <linux\/rcupdate_trace.h>' kernel/bpf/trampoline.c

      - name: Enable KernelSU and setup defconfig
        run: |
          sed -i 's/# CONFIG_KSU is not set/CONFIG_KSU=y/' arch/arm64/configs/defconfig
          if [ "${{ matrix.COMPILER }}" == "gcc" ]; then
            CROSS_COMPILE=aarch64-linux-gnu- make O=out defconfig ARCH=arm64
          else
            make O=out defconfig ARCH=arm64 CC=clang LLVM=1 CROSS_COMPILE=
          fi

      - name: Build kernel
        run: |
          if [ "${{ matrix.COMPILER }}" == "gcc" ]; then
            make -C . O=out -j$(nproc) \
              ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- 2>&1 | tee build.log
          else
            make -C . O=out -j$(nproc) \
              ARCH=arm64 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm \
              OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
              LLVM=1 LLVM_IAS=1 CROSS_COMPILE= 2>&1 | tee build.log
          fi
          exit ${PIPESTATUS[0]}

      - name: Upload kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz
          path: out/arch/arm64/boot/Image.gz

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
